<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Gym Operations Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/gym-theme.css}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 fw-bold mb-1">Gym Operations Dashboard</h1>
            <p class="text-muted mb-0">Live member growth, plan revenue, and workout class occupancy</p>
        </div>
        <a class="btn btn-ember mt-2 mt-md-0" th:href="@{/members/add}">+ Add Member</a>
    </div>

    <div class="row g-3">

        <div class="col-md-3">
            <div class="gym-kpi-card">
                <div class="gym-kpi-label">Total Members</div>
                <div class="gym-kpi-val" th:text="${totalMembers}"></div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="gym-kpi-card dark">
                <div class="gym-kpi-label">Total Revenue</div>
                <div class="gym-kpi-val" th:text="${totalRevenue} + ' DT'"></div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="gym-kpi-card">
                <div class="gym-kpi-label">Most Popular Plan</div>
                <div th:if="${popularPlan != null and popularPlan.length > 1}">
                    <div class="gym-kpi-val" th:text="${popularPlan[0]}"></div>
                </div>
                <div th:unless="${popularPlan != null and popularPlan.length > 1}">
                    <div class="gym-kpi-val fs-5 text-muted">No data</div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="gym-kpi-card dark">
                <div class="gym-kpi-label">Active Classes</div>
                <div class="gym-kpi-val" th:text="${#lists.size(classStats)}"></div>
            </div>
        </div>
    </div>

    <div class="row g-4 mt-1">
        <div class="col-lg-7">
            <div class="gym-surface p-4 h-100">
                <h5 class="fw-bold mb-3">Members Per Plan</h5>
                <canvas id="planChart"></canvas>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="gym-surface p-4 h-100">
                <h5 class="fw-bold mb-3">Class Occupancy</h5>
                <div th:each="c : ${classStats}" class="mb-3">
                    <div class="d-flex justify-content-between small mb-1">
                        <strong th:text="${c[0]}"></strong>
                        <span class="text-muted" th:text="${c[1]} + ' members'"></span>
                    </div>
                    <div class="progress progress-ember">
                        <div class="progress-bar"
                             role="progressbar"
                             th:style="'width:' + (${c[1]} * 10) + '%'">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="gym-surface p-4 mt-4 mb-4">

        <h5 class="fw-bold mb-3">Recent Registrations</h5>

        <div class="table-responsive">
            <table class="table gym-table align-middle mb-0">

                <thead>
                <tr>
                    <th>Photo</th>
                    <th>Name</th>
                    <th>Plan</th>
                    <th>Date</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="m : ${recentMembers}">
                    <td>
                        <img th:if="${m.photo != null}"
                             th:src="@{'/uploads/' + ${m.photo}}"
                             width="48"
                             height="48"
                             style="object-fit: cover;"
                             class="rounded-circle border">
                    </td>
                    <td class="fw-semibold" th:text="${m.firstName + ' ' + m.lastName}"></td>
                    <td>
                        <span class="badge bg-dark"
                              th:text="${m.membershipPlan != null ? m.membershipPlan.name : 'No Plan'}"></span>
                    </td>
                    <td class="text-muted" th:text="${m.registrationDate}"></td>
                </tr>
                </tbody>

            </table>
        </div>

    </div>

</div>

<!-- CHART JS -->
<script th:inline="javascript">

    let labels = [];
    let values = [];

</script>

<th:block th:each="item : ${membersByPlan}">

    <script th:inline="javascript">

        labels.push([[${item[0]}]]);
        values.push([[${item[1]}]]);

    </script>

</th:block>

<script>

    const ctx = document.getElementById('planChart');

    new Chart(ctx, {
        type: 'bar',

        data: {
            labels: labels,

            datasets: [{
                label: 'Members',
                data: values,
                backgroundColor: '#ea580c',
                borderColor: '#c2410c',
                borderRadius: 8,
                borderWidth: 1
            }]
        },

        options: {
            responsive: true,

            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

</script>

</body>
</html>

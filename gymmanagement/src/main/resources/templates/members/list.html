<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Members Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/gym-theme.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Members Directory</h2>
            <p class="text-muted mb-0">Search, inspect, and manage registered gym members</p>
        </div>
        <a class="btn btn-ember mt-2 mt-md-0" th:href="@{/members/add}">+ Add Member</a>
    </div>

    <div class="gym-surface p-4">
        <form class="row g-2 mb-3" method="get" th:action="@{/members}">
            <div class="col-md-9">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by member name or email..." class="form-control">
            </div>
            <div class="col-md-3 d-grid">
                <button type="submit" class="btn btn-dark">Search</button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table gym-table table-hover align-middle mb-0">

                <thead>
                <tr>
                    <th>Member</th>
                    <th>Email</th>
                    <th>Plan</th>
                    <th>Phone</th>
                    <th>Registered</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="m : ${memberPage.content}">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <img th:if="${m.photo != null}"
                                 th:src="@{'/uploads/' + ${m.photo}}"
                                 width="38"
                                 height="38"
                                 style="object-fit: cover;"
                                 class="rounded-circle border">
                            <span class="fw-semibold" th:text="${m.firstName + ' ' + m.lastName}"></span>
                        </div>
                    </td>
                    <td class="text-muted" th:text="${m.email}"></td>
                    <td>
                        <span class="badge bg-dark"
                              th:text="${m.membershipPlan != null ? m.membershipPlan.name : 'No Plan'}"></span>
                    </td>
                    <td th:text="${m.phone}"></td>
                    <td class="text-muted" th:text="${m.registrationDate}"></td>

                    <td>
                        <a th:href="@{'/members/details/' + ${m.id}}" class="btn btn-outline-dark btn-sm">Details</a>
                        <a th:href="@{'/members/edit/' + ${m.id}}" class="btn btn-warning btn-sm">Edit</a>
                        <a th:href="@{'/members/delete/' + ${m.id}}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
                </tbody>

            </table>
        </div>

        <div class="mt-3" th:if="${memberPage.totalPages > 0}">
            <a th:each="i : ${#numbers.sequence(0, memberPage.totalPages - 1)}"
               th:href="@{/members(page=${i}, keyword=${keyword})}"
               th:class="${i == memberPage.number} ? 'btn btn-ember btn-sm me-1' : 'btn btn-outline-dark btn-sm me-1'"
               th:text="${i + 1}">
            </a>
        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Workout Classes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/gym-theme.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Workout Classes</h2>
            <p class="text-muted mb-0">Group training sessions, schedules, and studio capacity</p>
        </div>
        <a class="btn btn-ember mt-2 mt-md-0" th:href="@{/classes/add}">+ Add Class</a>
    </div>

    <div class="gym-surface p-4">
        <div class="table-responsive">
            <table class="table gym-table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Schedule</th>
                    <th>Capacity</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${classes}">
                    <td class="fw-semibold" th:text="${c.name}"></td>
                    <td th:text="${c.schedule}"></td>
                    <td><span class="badge bg-dark" th:text="${c.capacity} + ' spots'"></span></td>

                    <td>
                        <a class="btn btn-warning btn-sm"
                           th:href="@{'/classes/edit/' + ${c.id}}">
                            Edit
                        </a>

                        <a class="btn btn-danger btn-sm"
                           th:href="@{'/classes/delete/' + ${c.id}}"
                           onclick="return confirm('Are you sure?')">
                            Delete
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Plan Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/gym-theme.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container py-4">

    <h2 class="fw-bold mb-3">Membership Plan Form</h2>

    <div class="gym-surface p-4">
        <form th:action="@{/plans/save}" th:object="${plan}" method="post">

            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label fw-semibold">Name</label>
                <input type="text" th:field="*{name}" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Price</label>
                <input type="number" step="0.01" th:field="*{price}" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Duration (Months)</label>
                <input type="number" th:field="*{durationMonths}" class="form-control">
            </div>

            <button class="btn btn-ember">Save Plan</button>

        </form>
    </div>

</div>

</body>
</html>

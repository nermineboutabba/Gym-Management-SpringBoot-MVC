<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Membership Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/gym-theme.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Membership Plans</h2>
            <p class="text-muted mb-0">Subscription tiers, billing pricing, and contract durations</p>
        </div>
        <a class="btn btn-ember mt-2 mt-md-0" th:href="@{/plans/add}">+ Add Plan</a>
    </div>

    <div class="gym-surface p-4">
        <div class="table-responsive">
            <table class="table gym-table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Plan Name</th>
                    <th>Price (DT)</th>
                    <th>Duration (Months)</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${plans}">
                    <td class="fw-semibold" th:text="${p.name}"></td>
                    <td><span class="fw-bold text-dark" th:text="${p.price} + ' DT'"></span></td>
                    <td><span class="badge bg-dark" th:text="${p.durationMonths} + ' mo'"></span></td>

                    <td>
                        <a class="btn btn-warning btn-sm"
                           th:href="@{'/plans/edit/' + ${p.id}}">
                            Edit
                        </a>

                        <a class="btn btn-danger btn-sm"
                           th:href="@{'/plans/delete/' + ${p.id}}"
                           onclick="return confirm('Delete this plan?')">
                            Delete
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
